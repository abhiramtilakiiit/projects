[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music-induced-emotions-narrative"
version = "1.0.0"
description = "Investigating the Role of Extramusical Contextual Narratives on Music-Induced Emotions"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Abhiram Tilak" },
    { name = "Niranjan Nagumalli" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]
