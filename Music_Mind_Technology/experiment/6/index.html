<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MMT Project</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Align items to the top */
            min-height: 100vh;
         
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }


        h1 {
            font-size: 3em;
            margin-bottom: 0.2em;
            color: #2c3e50;
        }

        p {
            max-width: 1000px;
            text-align: center;
            font-size: 1.2em;
            line-height: 1.6;
        }
    </style>
</head>
<body>
  <div class="container">
    <p> In the next section, you will hear a piece of music (duration approx. 6-7 minutes). Please concentrate on listening to the music – you can close your eyes if it helps you to concentrate. After the music ends, return back to the form and move to the next section.</p>
 
      <h1>Music</h1>
      <br>
      <audio controls>
          <source src="music.webm" type="audio/webm">
          Your browser does not support the audio element.
      </audio>
  </div>
</body>
</html>
